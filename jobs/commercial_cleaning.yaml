version: 1
name: commercial-cleaning-demo
search:
  query: commercial cleaning
  cities:
    - Denver, CO
sources:
  - csv
processing:
  deduplicate: true
  enrich: false
verification:
  phone:
    provider: twilio_lookup_basic
    credential_service: biz-intel
    api_key_account: TWILIO_API_KEY
    api_secret_account: TWILIO_API_SECRET
delivery:
  include_non_accepted: false
  include_sidecars: true
source_options:
  csv:
    path: tests/fixtures/commercial_cleaning_messy_synthetic.csv
output:
  format: csv
  fields:
    - name
    - category
    - address
    - city
    - phone
    - website
  destination: exports/commercial-cleaning-demo.csv
